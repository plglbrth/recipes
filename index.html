<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul's Recipes (for cooking)</title>
  <style>
     body { 
       background-color: #cbbaa7; 
       background-image: 
         radial-gradient(circle at 20% 30%, rgba(139, 90, 43, 0.15) 1px, transparent 150px),
         radial-gradient(circle at 75% 60%, rgba(90, 55, 30, 0.15) 1px, transparent 120px),
         radial-gradient(circle at 10% 85%, rgba(0,0,0,0.08) 2px, transparent 200px);
       color: #2b221a; 
       font-family: 'Georgia', serif; 
       padding: 12px; 
       line-height: 1.6; 
       box-sizing: border-box;
     }
     
     .book { 
       max-width: 800px; 
       margin: 0 auto; 
       background-color: #f6efe2; 
       background-image: 
         radial-gradient(circle, rgba(0,0,0,0.03) 1px, transparent 8px),
         radial-gradient(circle at 80% 25%, transparent 40px, rgba(100, 60, 30, 0.25) 41px, rgba(100, 60, 30, 0.12) 43px, transparent 48px),
         radial-gradient(circle at 81.5% 24.5%, rgba(100, 60, 30, 0.3) 1px, transparent 12px),
         radial-gradient(circle at 35% 72%, transparent 35px, rgba(90, 48, 20, 0.2) 36px, rgba(90, 48, 20, 0.08) 38px, transparent 42px),
         radial-gradient(ellipse at 88% 70%, rgba(90, 48, 20, 0.12) 0%, rgba(90, 48, 20, 0.08) 40%, transparent 70%),
         radial-gradient(circle at 0% 0%, rgba(90, 48, 20, 0.15) 0%, transparent 30%),
         radial-gradient(circle at 100% 100%, rgba(70, 40, 15, 0.15) 0%, transparent 40%),
         radial-gradient(ellipse at center, transparent 30%, rgba(90, 48, 20, 0.15) 100%);
       padding: 20px; 
       box-shadow: 0 4px 20px rgba(0,0,0,0.15), inset 0 0 40px rgba(90, 50, 20, 0.08); 
       border-radius: 4px; 
       border-left: 8px solid #5a381a; 
       position: relative;
       box-sizing: border-box;
     }

     @media (min-width: 600px) {
       body { padding: 25px; }
       .book { padding: 45px; border-left-width: 12px; }
     }
     
     .book::after {
       content: "";
       position: absolute;
       top: 0; left: 0; right: 0; bottom: 0;
       pointer-events: none;
       background-image:
         radial-gradient(rgba(255, 255, 255, 0.45) 1px, transparent 2px),
         radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1px);
       background-size: 140px 170px, 83px 97px;
       opacity: 0.85;
     }

     .header-nav {
       display: flex;
       justify-content: space-between;
       align-items: center;
       flex-wrap: wrap;
       gap: 10px;
       margin-bottom: 20px;
       padding-bottom: 15px;
       border-bottom: 1px dashed #d4c4b2;
     }

     .action-group {
       display: flex;
       gap: 8px;
       flex-wrap: wrap;
     }

     .action-btn {
       background: #e4d7c4;
       border: 1px solid #c8b9a6;
       color: #5a381a;
       padding: 6px 12px;
       font-family: inherit;
       font-size: 0.8em;
       cursor: pointer;
       border-radius: 4px;
       transition: all 0.2s;
       font-weight: bold;
     }
     .action-btn:hover {
       background: #d4c4b2;
     }
     .action-btn.active {
       background: #5a381a;
       color: #f6efe2;
     }

     h1 { 
       text-align: center; 
       border-bottom: 2px solid #2b221a; 
       padding-bottom: 15px; 
       font-weight: normal; 
       font-size: 2.4em; 
       margin-top: 5px; 
       margin-bottom: 20px;
       font-style: italic;
       letter-spacing: 1px;
     }

     h2 { 
       color: #6d421d; 
       border-bottom: 1px dashed #bba38a; 
       font-weight: normal; 
       margin-top: 40px; 
       font-style: italic; 
       padding-bottom: 5px;
     }

     .pantry-bar {
       display: flex;
       flex-wrap: wrap;
       gap: 6px;
       margin-bottom: 20px;
       justify-content: center;
       align-items: center;
     }
     .pantry-chip {
       background: #efe7db;
       border: 1px solid #d4c4b2;
       padding: 4px 10px;
       font-size: 0.8em;
       cursor: pointer;
       border-radius: 12px;
       color: #554332;
       transition: all 0.2s;
     }
     .pantry-chip.selected {
       background: #6d421d;
       color: #f6efe2;
       border-color: #6d421d;
     }

     .toc { 
       margin-bottom: 30px; 
       padding: 15px; 
       background-color: rgba(228, 215, 196, 0.4);
       border: 1px solid #c8b9a6; 
     }
     .toc h3 { 
       margin-top: 0; 
       font-weight: normal; 
       text-align: center; 
       font-size: 1.2em; 
       text-transform: uppercase; 
       letter-spacing: 1.5px; 
       margin-bottom: 15px; 
       border-bottom: 1px solid rgba(43,34,26,0.15);
       padding-bottom: 5px;
     }
     .toc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
     .toc-cat { font-weight: bold; color: #6d421d; text-decoration: none; display: block; margin-bottom: 5px; }
     .toc-recipes { list-style: none; padding-left: 10px; margin: 0; font-size: 0.85em; border-left: 2px solid #d4c4b2; }
     .toc-recipes a { color: #4e3e30; text-decoration: none; }
     .toc-recipes a:hover { text-decoration: underline; }
     
     .search-wrapper {
       display: flex; 
       gap: 10px; 
       margin-bottom: 20px;
       background: rgba(228, 215, 196, 0.3);
       padding: 8px 12px;
       border: 1px solid #d4c4b2;
       border-radius: 4px;
       align-items: center;
     }
     input { 
       width: 100%; 
       background: transparent; 
       border: none; 
       color: #2b221a; 
       padding: 4px 0; 
       font-family: inherit; 
       font-size: 1.05em; 
       outline: none; 
     }
     input::placeholder { color: #8c7a69; font-style: italic; }
     
     .recipe { margin-bottom: 40px; }
     .header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(43, 34, 26, 0.1); padding-bottom: 8px; margin-bottom: 12px; }
     .title { font-size: 1.4em; font-weight: bold; }
     .rating { cursor: pointer; font-size: 1.2em; color: rgba(0, 0, 0, 0.1); }
     .rating .active { color: #7c481d; }
     .recipe-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
     .ingredients-list { margin: 12px 0; font-size: 0.95em; color: #3b2f23; }
     .ingredients-list strong { color: #1a130b; }
     .ingredients-list ul { margin-top: 4px; padding-left: 18px; list-style-type: square; }
     .ingredients-list li { margin-bottom: 3px; }
     .method { white-space: pre-line; margin-top: 15px; padding-top: 12px; border-top: 1px dashed rgba(43, 34, 26, 0.1); color: #35291d; line-height: 1.7; }
     #loader { text-align: center; font-style: italic; color: #6d421d; margin-bottom: 20px;}

     #back-to-top {
       position: fixed;
       bottom: 20px;
       right: 20px;
       background: #5a381a;
       color: #f6efe2;
       border: none;
       border-radius: 50%;
       width: 45px;
       height: 45px;
       font-size: 1.2em;
       cursor: pointer;
       display: none;
       box-shadow: 0 3px 10px rgba(0,0,0,0.3);
       z-index: 1000;
     }
  </style>
</head>
<body>
  <div class="book" id="top">
    <div class="header-nav">
      <div class="action-group">
        <button class="action-btn" onclick="openAddModal()">+ Add Recipe</button>
        <button class="action-btn" onclick="dealRandomRecipe(false)">Recipe Roulette</button>
        <button class="action-btn" onclick="dealRandomRecipe(true)">Pick a Banger ★</button>
      </div>
      <div class="action-group">
        <button id="sortMostCookedBtn" class="action-btn" onclick="toggleMostCooked()">Most Cooked: OFF</button>
        <button id="wakeLockBtn" class="action-btn" onclick="toggleWakeLock()">Keep Awake: OFF</button>
      </div>
    </div>

    <h1>Paul's Recipes (for cooking)</h1>
    
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="Search by ingredient or name..." oninput="render()">
      <button class="action-btn" onclick="resetMatrix()" style="background: #d4c4b2;">Reset</button>
    </div>
    
    <div class="pantry-bar" id="pantry-bar">
      <span style="font-size: 0.85em; font-style: italic; margin-right: 5px;">Pantry:</span>
      <span id="pantry-chips-container" style="display: flex; flex-wrap: wrap; gap: 6px;">Loading pantry...</span>
    </div>

    <div id="loader">Flipping pages...</div>
    <div id="toc-container"></div>
    <div id="feed"></div>
  </div>

  <button id="back-to-top" onclick="scrollToTop()">↑</button>

  <!-- Add Recipe Modal -->
  <div id="addModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
    <div style="background:#f6efe2; padding:25px; border-radius:6px; max-width:500px; width:90%; border:2px solid #5a381a; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
      <h3 style="margin-top:0; color:#6d421d; font-style:italic; border-bottom:1px dashed #bba38a; padding-bottom:8px;">Add New Recipe</h3>
      <p style="font-size:0.85em; font-style:italic; margin-bottom:15px;">Paste the recipe JSON block below:</p>
      <textarea id="recipeInput" placeholder='{"name": "...", "category": "...", "ingredients": ["..."], "method": "...", "drink": "..."}' style="width:100%; height:140px; background:#fff; border:1px solid #c8b9a6; padding:8px; font-family:monospace; font-size:0.8em; box-sizing:border-box; margin-bottom:15px;"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="action-btn" onclick="closeAddModal()" style="background:#d4c4b2;">Cancel</button>
        <button class="action-btn" onclick="submitNewRecipe()" style="background:#5a381a; color:#f6efe2;">Submit to Sheet</button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTS8a7CIHfWzkLNQrthY39BrbZ4yuwa37ec5qAZYbZTYoExI52g2BRUqPV_Ey9nRJ8oEhILPJ6XZF-/pub?gid=0&single=true&output=csv";
    const INSERT_API_URL = "YOUR_INSERT_APPS_SCRIPT_URL";
    let db = [];
    let wakeLock = null;
    let selectedPantry = [];
    let sortByMostCooked = false;

    async function toggleWakeLock() {
      const btn = document.getElementById('wakeLockBtn');
      if ('wakeLock' in navigator) {
        try {
          if (wakeLock === null) {
            wakeLock = await navigator.wakeLock.request('screen');
            btn.textContent = 'Keep Awake: ON';
            btn.classList.add('active');
          } else {
            await wakeLock.release();
            wakeLock = null;
            btn.textContent = 'Keep Awake: OFF';
            btn.classList.remove('active');
          }
        } catch (err) {}
      }
    }

    function toggleMostCooked() {
      sortByMostCooked = !sortByMostCooked;
      const btn = document.getElementById('sortMostCookedBtn');
      if (sortByMostCooked) {
        btn.textContent = 'Most Cooked: ON';
        btn.classList.add('active');
      } else {
        btn.textContent = 'Most Cooked: OFF';
        btn.classList.remove('active');
      }
      render();
    }

    function openAddModal() {
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() {
      document.getElementById('addModal').style.display = 'none';
      document.getElementById('recipeInput').value = '';
    }

    function submitNewRecipe() {
      let rawText = document.getElementById('recipeInput').value.trim();
      if (!rawText) return;

      rawText = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '');

      let recipe;
      try {
        recipe = JSON.parse(rawText);
      } catch (err) {
        alert('Could not parse JSON. Make sure you are pasting valid JSON.');
        return;
      }

      let ingredientsStr = recipe.ingredients;
      if (Array.isArray(recipe.ingredients)) {
        ingredientsStr = recipe.ingredients.join('|');
      }

      const params = new URLSearchParams({
        name: recipe.name || recipe.title || 'Untitled Recipe',
        ingredients: ingredientsStr || '',
        category: recipe.category || recipe.type || 'Uncategorized',
        method: recipe.method || recipe.instructions || '',
        drink: recipe.drink || recipe.pairing || ''
      });

      fetch(`${INSERT_API_URL}?${params.toString()}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            alert('Recipe added successfully! Refreshing matrix...');
            closeAddModal();
            fetchRecipes();
          } else {
            alert('Error adding recipe: ' + (data.message || 'Unknown error'));
          }
        })
        .catch(err => alert('Network error submitting recipe.'));
    }

    function logMade(id) {
      const btn = document.getElementById(`made-btn-${id}`);
      if (btn) btn.textContent = 'Logging...';

      fetch(`${INSERT_API_URL}?action=log_made&id=${id}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            const recipe = db.find(r => r.id === id);
            if (recipe) {
              recipe.timesMade = data.newCount;
              const today = new Date().toISOString().split('T')[0];
              recipe.lastMade = today;
            }
            render();
          } else {
            alert('Error logging recipe: ' + (data.message || 'Unknown'));
            if (btn) btn.textContent = 'I Made This 🍳';
          }
        })
        .catch(err => {
          alert('Network error logging recipe.');
          if (btn) btn.textContent = 'I Made This 🍳';
        });
    }

    function generatePantryChips() {
      const curatedPantry = [
        'sweet potato', 'harissa', 'chickpeas', 'halloumi', 
        'chorizo', 'spinach', 'pasta', 'noodles', 'rice', 
        'coconut milk', 'passata', 'eggs'
      ];

      const container = document.getElementById('pantry-chips-container');
      container.innerHTML = curatedPantry.map(item => `
        <span class="pantry-chip ${selectedPantry.includes(item) ? 'selected' : ''}" onclick="togglePantry('${item}')">
          ${item.charAt(0).toUpperCase() + item.slice(1)}
        </span>
      `).join('');
    }

    function togglePantry(item) {
      const index = selectedPantry.indexOf(item);
      if (index > -1) {
        selectedPantry.splice(index, 1);
      } else {
        selectedPantry.push(item);
      }
      generatePantryChips();
      render();
    }

    function dealRandomRecipe(bangersOnly) {
      if (db.length === 0) return;
      let pool = bangersOnly ? db.filter(r => r.rating >= 4) : db;
      if (pool.length === 0) pool = db;
      
      const random = pool[Math.floor(Math.random() * pool.length)];
      
      document.getElementById('search').value = random.name;
      selectedPantry = [];
      generatePantryChips();
      render();
      const target = document.getElementById(`rec-${random.id}`);
      if (target) {
        window.scrollTo({top: target.offsetTop - 20, behavior: 'smooth'});
      }
    }

    function resetMatrix() {
      document.getElementById('search').value = '';
      selectedPantry = [];
      generatePantryChips();
      render();
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    window.onscroll = function() {
      const btn = document.getElementById('back-to-top');
      if (btn) {
        btn.style.display = (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) ? "block" : "none";
      }
    };

    function scrollToTop() {
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function parseCSV(text) {
      let p = '', row = [''], ret = [row], s = !0, l;
      for (l of text) {
        if ('"' === l) {
          s = !s;
          if (p === '"') { row[row.length - 1] += '"'; p = ''; }
          else p = '"';
        } else if (',' === l && s) {
          p = ''; row.push('');
        } else if ('\r' === l && s) {
        } else if ('\n' === l && s) {
          if (p === '\r') { row[row.length - 1] = row[row.length - 1].slice(0, -1); }
          row = ['']; ret.push(row); p = '';
        } else {
          row[row.length - 1] += l; p = l;
        }
      }
      return ret;
    }

    function fetchRecipes() {
      fetch(CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          const rows = parseCSV(csvText);
          db = [];
          for (let i = 1; i < rows.length; i++) {
            const cols = rows[i];
            if (cols.length >= 6 && cols[1]) {
              db.push({
                id: cols[0],
                name: cols[1],
                ingredients: cols[2] ? cols[2].split("|").map(x => x.trim()) : [],
                method: cols[3] || '',
                rating: parseInt(cols[4]) || 0,
                category: cols[5] || 'Uncategorized',
                drink: cols[6] || '',
                lastMade: cols[7] || '',
                timesMade: parseInt(cols[8]) || 0
              });
            }
          }
          document.getElementById('loader').style.display = 'none';
          generatePantryChips();
          render();
        })
        .catch(err => {
          document.getElementById('loader').textContent = "Error loading recipes.";
        });
    }

    window.rate = function(id, stars) {
      const r = db.find(x => x.id === id);
      if(r) {
        r.rating = stars;
        render(); 
      }
    };

    function render() {
      const query = document.getElementById('search').value.toLowerCase();
      const feed = document.getElementById('feed');
      const tocContainer = document.getElementById('toc-container');
      
      const filtered = db.filter(r => {
        const matchesQuery = r.name.toLowerCase().includes(query) || 
                             r.ingredients.some(i => i.toLowerCase().includes(query));
        
        const matchesPantry = selectedPantry.every(p => 
          r.ingredients.some(i => i.toLowerCase().includes(p))
        );

        return matchesQuery && matchesPantry;
      });

      if (filtered.length === 0) {
          tocContainer.innerHTML = '';
          feed.innerHTML = "<p style='text-align:center; font-style:italic;'>No recipes found.</p>";
          return;
      }

      if (sortByMostCooked) {
        filtered.sort((a, b) => b.timesMade - a.timesMade);
      }

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.category]) grouped[r.category] = [];
        grouped[r.category].push(r);
      });

      const categories = Object.keys(grouped).sort();

      if (query === '' && selectedPantry.length === 0 && !sortByMostCooked) {
        tocContainer.innerHTML = `
          <div class="toc">
            <h3>Table of Contents</h3>
            <div class="toc-grid">
              ${categories.map(cat => `
                <div>
                  <a class="toc-cat" href="#cat-${cat.replace(/\s+/g, '-')}">${cat}</a>
                  <ul class="toc-recipes">
                    ${grouped[cat].map(r => `
                      <li><a href="#rec-${r.id}">${r.name}</a></li>
                    `).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        tocContainer.innerHTML = ''; 
      }

      feed.innerHTML = categories.map(cat => `
          <h2 id="cat-${cat.replace(/\s+/g, '-')}">${cat}</h2>
          ${grouped[cat].map(r => `
              <div class="recipe" id="rec-${r.id}">
                  <div class="header">
                      <div class="title">${r.name}</div>
                      <div class="rating">
                          ${[1,2,3,4,5].map(s => `<span class="${s <= r.rating ? 'active' : ''}" onclick="rate('${r.id}', ${s})">★</span>`).join('')}
                      </div>
                  </div>
                  <div class="recipe-badges">
                      ${r.drink ? `<div style="font-size: 0.85em; font-style: italic; color: #5a381a; background: rgba(228, 215, 196, 0.4); padding: 3px 8px; border-radius: 3px; display: inline-block;">🍷 Pour: ${r.drink}</div>` : ''}
                      <div style="font-size: 0.8em; font-style: italic; color: #7c481d; background: rgba(124, 72, 29, 0.1); padding: 3px 8px; border-radius: 3px; display: inline-block;">
                          🔥 Cooked: ${r.timesMade} time${r.timesMade === 1 ? '' : 's'}${r.lastMade ? `(Last: ${r.lastMade})` : ''}
                      </div>
                      <button id="made-btn-${r.id}" class="action-btn" style="font-size: 0.75em; padding: 3px 8px; margin-left: auto;" onclick="logMade('${r.id}')">I Made This 🍳</button>
                  </div>
                  <div class="ingredients-list">
                      <strong>Ingredients:</strong>
                      <ul>
                          ${r.ingredients.map(i => `<li>${i.trim()}</li>`).join('')}
                      </ul>
                  </div>
                  <div class="method">${r.method}</div>
              </div>
          `).join('')}
      `).join('');
    }

    fetchRecipes();
  </script>
</body>
</html>
