<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Matrix</title>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --text-color: #2b2b2b;
      --accent-color: #8b0000;
      --border-color: #ddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-banner img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input[type="text"], select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 16px;
      flex: 1;
    }

    .btn {
      padding: 10px 16px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .recipe-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .recipe-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: var(--accent-color);
    }

    .recipe-meta {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 10px;
    }

    .recipe-section {
      margin-bottom: 12px;
    }

    .recipe-section strong {
      display: block;
      margin-bottom: 4px;
    }

    .star-rating {
      color: #f39c12;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .recipe-notes-container {
      margin-top: 15px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }

    .recipe-notes-container label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .recipe-notes-container textarea {
      width: 100%;
      min-height: 60px;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 0.9rem;
      box-sizing: border-box;
      resize: vertical;
    }

    .card-actions {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>


    <h1>Recipe Matrix</h1>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Search recipes or ingredients..." oninput="filterRecipes()">
      <select id="category-filter" onchange="filterRecipes()">
        <option value="">All Categories</option>
      </select>
    </div>

    <div id="recipe-grid" class="recipe-grid">
      <p>Loading recipes...</p>
    </div>
  </div>

  <script>
    const INSERT_API_URL = "https://script.google.com/macros/s/AKfycbz-eWkTyhE0JpGl8GxvVvXllX3Y4NJpqfKRYzA9VnbQ0TQGmhOC70VYBRH_fiOyFdcr/exec";
    
    let recipes = [];

    // Helper to parse CSV properly handling quoted values
    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = [];
        let insideQuote = false;
        let entry = '';
        for (let char of lines[i]) {
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));
        result.push(row);
      }
      return result;
    }

    async function loadRecipes() {
      try {
        // Fetch raw CSV export from Google Sheet or backend JSON
        const response = await fetch(INSERT_API_URL);
        const data = await response.json();
        
        if (Array.isArray(data)) {
          recipes = data;
        } else if (data.recipes) {
          recipes = data.recipes;
        } else {
          console.log("Backend online check:", data);
        }
        
        populateCategories();
        renderRecipes(recipes);
      } catch (err) {
        console.error("Error loading recipes:", err);
        document.getElementById('recipe-grid').innerHTML = '<p>Failed to load recipes. Check API URL or CORS settings.</p>';
      }
    }

    function populateCategories() {
      const select = document.getElementById('category-filter');
      const categories = [...new Set(recipes.map(r => r.category).filter(Boolean))];
      select.innerHTML = '<option value="">All Categories</option>' + 
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderRecipes(items) {
      const grid = document.getElementById('recipe-grid');
      if (items.length === 0) {
        grid.innerHTML = '<p>No recipes found.</p>';
        return;
      }

      grid.innerHTML = items.map(r => `
        <div class="recipe-card" id="card-${r.id}">
          <div>
            <h2>${r.name || 'Untitled Recipe'}</h2>
            <div class="recipe-meta">
              <span>Category: ${r.category || 'Uncategorized'}</span> | 
              <span>Times Made: <strong id="count-${r.id}">${r.timesMade || 0}</strong></span>
              ${r.lastMade ? ` | <span>Last: ${r.lastMade}</span>` : ''}
            </div>

            ${r.drink ? `<div class="recipe-section"><strong>Drink Pairing:</strong> ${r.drink}</div>` : ''}
            <div class="recipe-section"><strong>Ingredients:</strong> ${r.ingredients || 'None listed'}</div>
            <div class="recipe-section"><strong>Method:</strong> ${r.method || 'None listed'}</div>
          </div>

          <div>
            <div class="card-actions">
              <div class="star-rating">
                ${[1, 2, 3, 4, 5].map(star => `
                  <span onclick="rateRecipe('${r.id}', ${star})" style="cursor:pointer;">
                    ${star <= (r.rating || 0) ? '★' : '☆'}
                  </span>
                `).join('')}
              </div>
              <button class="btn" onclick="logMade('${r.id}')">Cooked This!</button>
            </div>

            <div class="recipe-notes-container">
              <label for="notes-${r.id}">Chef's Notes:</label>
              <textarea 
                id="notes-${r.id}"
                placeholder="e.g., Use less chili, sub double cream..." 
                onchange="saveRecipeNotes('${r.id}', this.value)"
              >${r.notes || ''}</textarea>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterRecipes() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const cat = document.getElementById('category-filter').value;

      const filtered = recipes.filter(r => {
        const matchesQuery = (r.name && r.name.toLowerCase().includes(query)) ||
                             (r.ingredients && r.ingredients.toLowerCase().includes(query)) ||
                             (r.notes && r.notes.toLowerCase().includes(query));
        const matchesCat = !cat || r.category === cat;
        return matchesQuery && matchesCat;
      });

      renderRecipes(filtered);
    }

    async function rateRecipe(id, rating) {
      try {
        const res = await fetch(`${INSERT_API_URL}?action=rate&id=${encodeURIComponent(id)}&rating=${rating}`);
        const data = await res.json();
        if (data.status === 'success') {
          const target = recipes.find(r => String(r.id) === String(id));
          if (target) target.rating = rating;
          renderRecipes(recipes);
        }
      } catch (err) {
        console.error("Error setting rating:", err);
      }
    }

    async function logMade(id) {
      try {
        const res = await fetch(`${INSERT_API_URL}?action=log_made&id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.status === 'success') {
          const target = recipes.find(r => String(r.id) === String(id));
          if (target) {
            target.timesMade = data.newCount;
            target.lastMade = data.lastMade;
          }
          renderRecipes(recipes);
        }
      } catch (err) {
        console.error("Error logging cook:", err);
      }
    }

    async function saveRecipeNotes(id, notesText) {
      try {
        const res = await fetch(`${INSERT_API_URL}?action=update_notes&id=${encodeURIComponent(id)}&notes=${encodeURIComponent(notesText)}`);
        const data = await res.json();
        if (data.status === 'success') {
          const target = recipes.find(r => String(r.id) === String(id));
          if (target) target.notes = notesText;
        } else {
          console.error("Failed to save notes:", data.message);
        }
      } catch (err) {
        console.error("Network error saving notes:", err);
      }
    }

    window.onload = loadRecipes;
  </script>
</body>
</html>
